<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KargoCI — Livraison de Colis en Côte d'Ivoire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Barlow:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0D1F15; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
    #root { height: 100%; display: flex; align-items: center; justify-content: center; }

    /* Animated background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 20%, #1B4332 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, #0D2818 0%, transparent 50%),
                  linear-gradient(135deg, #0A1A10 0%, #0D1F15 50%, #081610 100%);
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(52,183,97,0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      z-index: 0;
    }
    #root { position: relative; z-index: 1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(52,183,97,0.3); border-radius: 2px; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-40px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    @keyframes ping {
      0% { transform: scale(1); opacity: 1; }
      75%, 100% { transform: scale(2); opacity: 0; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scooterMove {
      0% { transform: translateX(-10px) rotate(-2deg); }
      50% { transform: translateX(10px) rotate(2deg); }
      100% { transform: translateX(-10px) rotate(-2deg); }
    }
    @keyframes dotMove {
      0%, 100% { transform: translate(20px, 30px); }
      25% { transform: translate(60px, 10px); }
      50% { transform: translate(110px, 40px); }
      75% { transform: translate(150px, 15px); }
    }

    .screen-enter { animation: fadeInUp 0.3s ease both; }
    .screen-enter-right { animation: slideInRight 0.3s ease both; }
    .screen-enter-left { animation: slideInLeft 0.3s ease both; }

    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; outline: none; }

    /* Status bar */
    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 20px 4px;
      font-size: 11px; font-weight: 700;
      color: #1A1A1A; letter-spacing: 0.3px;
    }
    .status-bar.light { color: #fff; }
    .status-icons { display: flex; align-items: center; gap: 4px; }

    /* Map SVG */
    .map-container {
      width: 100%; height: 200px;
      background: #E8F4EA;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ─── CONSTANTS ──────────────────────────────────────────────── */
    const G_DARK  = "#0F2D1A";
    const G_MID   = "#1B5E35";
    const G_CTA   = "#1E6B3C";
    const G_BTN   = "#22773F";
    const G_LIGHT = "#34A853";
    const G_PALE  = "#E8F5ED";
    const G_PALE2 = "#D1EDDA";
    const WHITE   = "#FFFFFF";
    const BG      = "#F8FAF8";
    const BORDER  = "#E8EEE9";
    const TEXT     = "#111A13";
    const TEXT_M   = "#6B7F70";
    const ORANGE   = "#E65100";
    const ORANGE_P = "#FFF3E0";
    const RED      = "#B71C1C";
    const RED_P    = "#FFEBEE";
    const BLUE_FB  = "#1877F2";
    const WAVE     = "#0066CC";

    /* ─── FAKE DATA ────────────────────────────────────────────── */
    const USER = { name: "François Konan", first: "François", phone: "+225 07 10 10 100", balance: 18500, code: "AF7532SE", initials: "FK" };

    const ORDERS = [
      { id: "104534", status: "en_cours", from: "Williamsville", to: "Abobo",      amount: 1500,  payment: "À la Livraison",      time: "À l'instant", diff: -1566 },
      { id: "104533", status: "livre",    from: "Plateau",       to: "Treichville", amount: 2500, payment: "Reçu Orange Money",    time: "Hier" },
      { id: "104532", status: "echoue",   from: "Marcory",       to: "Abobo",       amount: 2500, payment: "Paiement Livraison",  time: "Il y a 2 jrs" },
      { id: "104531", status: "livre",    from: "Cocody",        to: "Yopougon",    amount: 2100, payment: "Reçu Orange Money",   time: "Il y a 3 jrs" },
      { id: "104448", status: "echoue",   from: "Marcory",       to: "Abobo",       amount: 2500, payment: "Paiement Livraison",  time: "Il y a 5 jrs" },
    ];

    const ADMIN_STATS = { livraisons: 8412, conducteurs: 2120, actifs: 3450, revenus: 753500 };
    const TOP_DRIVERS = [
      { name: "Amadou", trips: 45, amount: "3 440 FCFA", initials: "AM" },
      { name: "Kader Traoré", trips: 38, amount: "3 389 FCFA", initials: "KT" },
      { name: "Karim Dialaté", trips: 35, amount: "3 289 FCFA", initials: "KD" },
      { name: "Maxime Touré", trips: 30, amount: "2 800 FCFA", initials: "MT" },
    ];

    /* ─── SHARED ATOMS ─────────────────────────────────────────── */
    const fmtFCFA = (n) => n.toLocaleString("fr-CI") + " FCFA";

    const StatusBadge = ({ status }) => {
      const cfg = {
        en_cours: { label: "En Cours",  bg: ORANGE_P, color: ORANGE },
        livre:    { label: "Livré",     bg: G_PALE,   color: G_MID },
        echoue:   { label: "Échoué",    bg: RED_P,    color: RED },
      }[status] || {};
      return (
        <span style={{ padding: "3px 10px", borderRadius: 20, fontSize: 10, fontWeight: 700, background: cfg.bg, color: cfg.color, whiteSpace: "nowrap" }}>
          {cfg.label}
        </span>
      );
    };

    const StatusBar = ({ light }) => (
      <div className={`status-bar${light ? " light" : ""}`}>
        <span style={{ fontWeight: 700, fontSize: 12 }}>9:41</span>
        <div className="status-icons">
          <svg width="15" height="11" viewBox="0 0 15 11" fill={light ? "white" : TEXT}>
            <rect x="0" y="4" width="3" height="7" rx="1"/>
            <rect x="4" y="2" width="3" height="9" rx="1"/>
            <rect x="8" y="0" width="3" height="11" rx="1"/>
            <rect x="12" y="0" width="3" height="11" rx="1" opacity="0.3"/>
          </svg>
          <svg width="14" height="11" viewBox="0 0 14 11" fill={light ? "white" : TEXT}>
            <path d="M7 2.5C9.2 2.5 11.2 3.5 12.5 5.1L14 3.3C12.3 1.3 9.8 0 7 0S1.7 1.3 0 3.3L1.5 5.1C2.8 3.5 4.8 2.5 7 2.5Z"/>
            <path d="M7 6C8.3 6 9.5 6.6 10.3 7.6L11.8 5.8C10.6 4.4 8.9 3.5 7 3.5S3.4 4.4 2.2 5.8L3.7 7.6C4.5 6.6 5.7 6 7 6Z"/>
            <circle cx="7" cy="10" r="1.5"/>
          </svg>
          <svg width="22" height="11" viewBox="0 0 22 11" fill="none">
            <rect x="0.5" y="0.5" width="18" height="10" rx="2" stroke={light ? "white" : TEXT} strokeOpacity="0.5"/>
            <rect x="2" y="2" width="13" height="7" rx="1" fill={light ? "white" : TEXT}/>
            <path d="M20 3.5C20.8 4 21 4.5 21 5.5S20.8 7 20 7.5V3.5Z" fill={light ? "white" : TEXT} opacity="0.5"/>
          </svg>
        </div>
      </div>
    );

    const BackBtn = ({ onPress, light }) => (
      <button onClick={onPress} style={{ background: "none", border: "none", padding: "4px 8px 4px 0", display: "flex", alignItems: "center" }}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke={light ? WHITE : TEXT} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
    );

    const KargoLogo = ({ size = 28, color = G_LIGHT }) => (
      <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
        <path d="M16 2L4 8V17C4 23.1 9.3 28.8 16 30C22.7 28.8 28 23.1 28 17V8L16 2Z" fill={color}/>
        <path d="M11 15L14 18L21 11" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        <path d="M10 20H22" stroke="white" strokeWidth="1.5" strokeLinecap="round" opacity="0.5"/>
      </svg>
    );

    const GreenBtn = ({ label, onPress, outline, style: sx = {}, disabled }) => (
      <button
        onClick={onPress}
        disabled={disabled}
        style={{
          width: "100%", padding: "15px 24px",
          background: outline ? "transparent" : G_BTN,
          color: outline ? G_BTN : WHITE,
          border: outline ? `2px solid ${G_BTN}` : "none",
          borderRadius: 14, fontSize: 15, fontWeight: 700,
          letterSpacing: "0.5px", transition: "all 0.15s",
          opacity: disabled ? 0.5 : 1,
          ...sx
        }}
        onMouseDown={e => e.currentTarget.style.transform = "scale(0.97)"}
        onMouseUp={e => e.currentTarget.style.transform = "scale(1)"}
      >
        {label}
      </button>
    );

    const Divider = ({ label = "Ou" }) => (
      <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "6px 0" }}>
        <div style={{ flex: 1, height: 1, background: BORDER }}/>
        <span style={{ color: TEXT_M, fontSize: 13, fontWeight: 500 }}>{label}</span>
        <div style={{ flex: 1, height: 1, background: BORDER }}/>
      </div>
    );

    /* ─── MAP SVG ──────────────────────────────────────────────── */
    const AbidjMap = ({ animated }) => (
      <div className="map-container" style={{ borderRadius: 16, overflow: "hidden", height: 200, position: "relative", background: "#E8F4EA" }}>
        <svg width="100%" height="100%" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
          {/* Roads */}
          <rect width="360" height="200" fill="#EAF2EB"/>
          {/* Grid streets */}
          {[0,40,80,120,160,200].map(y => (
            <line key={y} x1="0" y1={y} x2="360" y2={y} stroke="#D0E8D4" strokeWidth="1"/>
          ))}
          {[0,50,100,150,200,250,300,350].map(x => (
            <line key={x} x1={x} y1="0" x2={x} y2="200" stroke="#D0E8D4" strokeWidth="1"/>
          ))}
          {/* Main avenues */}
          <path d="M0 100 Q90 90 180 100 Q270 110 360 100" stroke="#C8E0CC" strokeWidth="18" fill="none"/>
          <path d="M0 100 Q90 90 180 100 Q270 110 360 100" stroke="#DAEEDE" strokeWidth="16" fill="none"/>
          <path d="M180 0 Q170 50 180 100 Q190 150 180 200" stroke="#C8E0CC" strokeWidth="14" fill="none"/>
          <path d="M180 0 Q170 50 180 100 Q190 150 180 200" stroke="#DAEEDE" strokeWidth="12" fill="none"/>
          {/* Secondary streets */}
          <path d="M0 40 Q120 30 240 50 Q300 60 360 40" stroke="#DAEEDE" strokeWidth="8" fill="none"/>
          <path d="M0 160 Q120 155 240 165 Q300 170 360 160" stroke="#DAEEDE" strokeWidth="8" fill="none"/>
          <path d="M60 0 Q50 60 70 120 Q80 160 60 200" stroke="#DAEEDE" strokeWidth="8" fill="none"/>
          <path d="M290 0 Q285 60 295 120 Q300 160 290 200" stroke="#DAEEDE" strokeWidth="8" fill="none"/>
          {/* Buildings */}
          {[[20,20,30,25,G_PALE],[70,10,20,30,G_PALE2],[140,20,35,20,G_PALE],[220,15,25,30,G_PALE2],[300,20,40,25,G_PALE],[20,130,25,30,G_PALE2],[80,140,30,20,G_PALE],[160,130,20,35,G_PALE2],[240,140,35,20,G_PALE],[310,130,25,30,G_PALE]].map(([x,y,w,h,c],i) => (
            <rect key={i} x={x} y={y} width={w} height={h} rx="3" fill={c} stroke="#BDD9C3" strokeWidth="0.5"/>
          ))}
          {/* Route line */}
          <path d="M50 150 Q90 130 130 120 Q160 110 180 100 Q210 85 250 70 Q280 60 310 50" stroke={G_BTN} strokeWidth="3" fill="none" strokeDasharray="6 3" opacity="0.8"/>
          {/* Pin collecte */}
          <circle cx="50" cy="150" r="12" fill={G_CTA}/>
          <text x="50" y="155" textAnchor="middle" fill="white" fontSize="10" fontWeight="bold">C</text>
          {/* Pin destination */}
          <circle cx="310" cy="50" r="12" fill="#E53935"/>
          <text x="310" y="55" textAnchor="middle" fill="white" fontSize="10" fontWeight="bold">D</text>
          {/* Animated scooter */}
          {animated && (
            <g style={{ animation: "dotMove 4s ease-in-out infinite" }}>
              <circle r="10" fill={G_LIGHT} opacity="0.3">
                <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
              </circle>
              <circle r="7" fill={G_LIGHT}/>
              <text y="4" textAnchor="middle" fontSize="8">🛵</text>
            </g>
          )}
        </svg>
        {/* District labels */}
        <div style={{ position: "absolute", top: 12, left: 16, background: "white", borderRadius: 8, padding: "3px 8px", fontSize: 10, fontWeight: 600, color: G_CTA, boxShadow: "0 1px 4px rgba(0,0,0,0.1)" }}>Collecte</div>
        <div style={{ position: "absolute", bottom: 12, right: 16, background: "white", borderRadius: 8, padding: "3px 8px", fontSize: 10, fontWeight: 600, color: "#E53935", boxShadow: "0 1px 4px rgba(0,0,0,0.1)" }}>Destination</div>
      </div>
    );

    /* ─── BOTTOM NAV ──────────────────────────────────────────── */
    const BottomNav = ({ active, nav }) => {
      const items = [
        { id: "home", label: "Accueil", icon: (a) => (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M3 9L12 2L21 9V20C21 20.6 20.6 21 20 21H15V15H9V21H4C3.4 21 3 20.6 3 20V9Z" fill={a ? G_LIGHT : "none"} stroke={a ? G_LIGHT : TEXT_M} strokeWidth="2" strokeLinejoin="round"/>
          </svg>
        )},
        { id: "commande", label: "Commandes", icon: (a) => (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="18" height="18" rx="3" fill={a ? G_PALE : "none"} stroke={a ? G_LIGHT : TEXT_M} strokeWidth="2"/>
            <path d="M8 8H16M8 12H16M8 16H12" stroke={a ? G_LIGHT : TEXT_M} strokeWidth="2" strokeLinecap="round"/>
          </svg>
        )},
        { id: "profil", label: "Solde", icon: (a) => (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="6" width="20" height="14" rx="3" fill={a ? G_PALE : "none"} stroke={a ? G_LIGHT : TEXT_M} strokeWidth="2"/>
            <path d="M16 13C16 13.6 16.4 14 17 14H20V12H17C16.4 12 16 12.4 16 13Z" fill={a ? G_LIGHT : TEXT_M}/>
            <path d="M2 10H22" stroke={a ? G_LIGHT : TEXT_M} strokeWidth="2"/>
          </svg>
        )},
        { id: "profil", label: "Profil", icon: (a) => (
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" fill={a ? G_PALE : "none"} stroke={a ? G_LIGHT : TEXT_M} strokeWidth="2"/>
            <path d="M4 20C4 16.7 7.6 14 12 14S20 16.7 20 20" stroke={a ? G_LIGHT : TEXT_M} strokeWidth="2" strokeLinecap="round"/>
          </svg>
        )},
      ];
      return (
        <div style={{ display: "flex", borderTop: `1px solid ${BORDER}`, background: WHITE, padding: "8px 0 4px" }}>
          {items.map((item, i) => {
            const isActive = active === item.id;
            return (
              <button key={i} onClick={() => nav(item.id)} style={{ flex: 1, background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "4px 0" }}>
                {item.icon(isActive)}
                <span style={{ fontSize: 9, fontWeight: isActive ? 700 : 500, color: isActive ? G_LIGHT : TEXT_M }}>{item.label}</span>
              </button>
            );
          })}
        </div>
      );
    };

    /* ─── SCREEN 1: SPLASH ──────────────────────────────────────── */
    const SplashScreen = ({ nav }) => (
      <div className="screen-enter" style={{ display: "flex", flexDirection: "column", height: "100%", background: `linear-gradient(170deg, ${G_DARK} 0%, ${G_MID} 100%)`, padding: 0, overflow: "hidden", position: "relative" }}>
        {/* Decorative circles */}
        <div style={{ position: "absolute", top: -80, right: -80, width: 300, height: 300, borderRadius: "50%", background: "rgba(52,168,83,0.1)", pointerEvents: "none" }}/>
        <div style={{ position: "absolute", top: -40, right: -40, width: 200, height: 200, borderRadius: "50%", background: "rgba(52,168,83,0.08)", pointerEvents: "none" }}/>

        <StatusBar light />

        <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 32px", gap: 0 }}>
          {/* Logo */}
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 40, animation: "fadeInUp 0.5s ease" }}>
            <KargoLogo size={44} color={G_LIGHT} />
            <span style={{ color: WHITE, fontSize: 32, fontWeight: 800, letterSpacing: "-0.5px", fontFamily: "Barlow, sans-serif" }}>KargoCI</span>
          </div>

          {/* Scooter illustration */}
          <div style={{ width: 220, height: 180, display: "flex", alignItems: "center", justifyContent: "center", position: "relative", marginBottom: 16 }}>
            {/* Shadow */}
            <div style={{ position: "absolute", bottom: 10, left: "50%", transform: "translateX(-50%)", width: 140, height: 20, background: "rgba(0,0,0,0.3)", borderRadius: "50%", filter: "blur(8px)" }}/>
            {/* Ground */}
            <div style={{ position: "absolute", bottom: 20, left: 0, right: 0, height: 2, background: "rgba(255,255,255,0.15)", borderRadius: 2 }}/>
            {/* Scooter SVG */}
            <svg width="200" height="150" viewBox="0 0 200 150" fill="none" style={{ animation: "scooterMove 3s ease-in-out infinite" }}>
              {/* Rider body */}
              <ellipse cx="110" cy="55" rx="18" ry="22" fill="#2D6A4F"/>
              {/* Head */}
              <circle cx="110" cy="30" r="14" fill="#F5CBA7"/>
              {/* Helmet */}
              <path d="M96 28C96 18 103 12 110 12C117 12 124 18 124 28H96Z" fill={G_LIGHT}/>
              <path d="M96 28C96 28 98 32 110 32C122 32 124 28 124 28" stroke={G_LIGHT} strokeWidth="2"/>
              {/* Jacket */}
              <rect x="96" y="44" width="28" height="30" rx="4" fill="#1B4332"/>
              {/* Arm */}
              <path d="M124 58 Q140 55 145 60" stroke="#1B4332" strokeWidth="6" strokeLinecap="round"/>
              {/* Delivery box */}
              <rect x="60" y="44" width="36" height="28" rx="4" fill="#2D9CDB"/>
              <path d="M60 56H96M78 44V72" stroke="white" strokeWidth="1.5" opacity="0.5"/>
              <rect x="65" y="48" width="10" height="7" rx="1" fill="white" opacity="0.3"/>
              {/* Scooter body */}
              <path d="M40 90 Q60 70 100 72 Q130 74 150 80 Q160 84 165 90H40Z" fill={G_MID}/>
              <path d="M50 90 Q70 78 105 78 Q135 78 155 85L155 90H50Z" fill={G_LIGHT}/>
              {/* Handlebars */}
              <path d="M145 62 Q155 64 160 72" stroke="#888" strokeWidth="4" strokeLinecap="round"/>
              <circle cx="160" cy="73" r="4" fill="#555"/>
              {/* Wheels */}
              <circle cx="65" cy="110" r="26" fill="#1A1A1A"/>
              <circle cx="65" cy="110" r="18" fill="#333"/>
              <circle cx="65" cy="110" r="6" fill="#888"/>
              <circle cx="155" cy="110" r="24" fill="#1A1A1A"/>
              <circle cx="155" cy="110" r="16" fill="#333"/>
              <circle cx="155" cy="110" r="6" fill="#888"/>
              {/* Spokes */}
              {[0,60,120,180,240,300].map(a => (
                <line key={a} x1="65" y1="110" x2={65 + 17*Math.cos(a*Math.PI/180)} y2={110 + 17*Math.sin(a*Math.PI/180)} stroke="#555" strokeWidth="1.5"/>
              ))}
              {[0,60,120,180,240,300].map(a => (
                <line key={a} x1="155" y1="110" x2={155 + 15*Math.cos(a*Math.PI/180)} y2={110 + 15*Math.sin(a*Math.PI/180)} stroke="#555" strokeWidth="1.5"/>
              ))}
              {/* Windshield */}
              <path d="M140 72 Q148 64 155 64 Q158 64 158 68 Q155 70 148 72Z" fill="rgba(135,206,250,0.6)"/>
            </svg>
          </div>

          {/* Tagline */}
          <div style={{ textAlign: "center", animation: "fadeInUp 0.6s ease 0.1s both" }}>
            <p style={{ color: "rgba(255,255,255,0.9)", fontSize: 16, fontWeight: 500, lineHeight: 1.5, maxWidth: 240 }}>
              La solution rapide pour envoyer vos colis <strong style={{ color: G_LIGHT }}>partout en Côte d'Ivoire</strong>
            </p>
          </div>
        </div>

        {/* Buttons */}

            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <KargoLogo size={24} color={G_LIGHT}/>
              <span style={{ fontSize: 16, fontWeight: 800, color: WHITE, fontFamily: "Barlow, sans-serif" }}>Tableau de Bord</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,0.08)", borderRadius: 20, padding: "5px 12px" }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: G_LIGHT, display: "inline-block" }}/>
              <span style={{ fontSize: 12, color: WHITE, fontWeight: 600 }}>Admin</span>
            </div>
          </div>
          {/* Big stats */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {[
              { label: "Livraisons", value: ADMIN_STATS.livraisons.toLocaleString(), icon: "📦", color: G_LIGHT },
              { label: "Conducteurs", value: ADMIN_STATS.conducteurs.toLocaleString(), icon: "🛵", color: "#64B5F6" },
              { label: "Colis Actifs", value: ADMIN_STATS.actifs.toLocaleString(), icon: "🟢", color: "#FFD54F" },
              { label: "Revenus FCFA", value: (ADMIN_STATS.revenus/1000).toFixed(0)+"K", icon: "💰", color: "#81C784" },
            ].map((s, i) => (
              <div key={i} style={{ background: "rgba(255,255,255,0.07)", borderRadius: 14, padding: "12px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                  <span style={{ fontSize: 16 }}>{s.icon}</span>
                  <span style={{ fontSize: 11, color: "rgba(255,255,255,0.5)" }}>{s.label}</span>
                </div>
                <p style={{ fontSize: 24, fontWeight: 800, color: s.color, fontFamily: "Barlow, sans-serif" }}>{s.value}</p>
              </div>
            ))}
          </div>
        </div>

        <div style={{ flex: 1, overflowY: "auto", padding: 16 }}>
          {/* Livraisons récentes */}
          <p style={{ fontSize: 14, fontWeight: 700, color: TEXT, marginBottom: 10 }}>Livraisons Récentes</p>
          {[
            { id: "104534", route: "Plateau → Treichville", driver: "Amadou", amount: 2100, status: "en_cours" },
            { id: "104533", route: "Cocody → Yopougon", driver: "Kader Traoré", amount: 1800, status: "livre" },
            { id: "104532", route: "Marcory → Abobo", driver: "Karim Dialaté", amount: 2500, status: "echoue" },
          ].map((d, i) => (
            <div key={i} style={{ background: WHITE, borderRadius: 14, padding: "12px 16px", marginBottom: 8, border: `1px solid ${BORDER}`, display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: G_PALE, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>📦</div>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
                  <span style={{ fontSize: 11, fontWeight: 700, color: G_CTA }}>#{d.id}</span>
                  <StatusBadge status={d.status}/>
                </div>
                <p style={{ fontSize: 12, color: TEXT, fontWeight: 500 }}>{d.route}</p>
                <p style={{ fontSize: 11, color: TEXT_M }}>Livreur: {d.driver}</p>
              </div>
              <p style={{ fontSize: 14, fontWeight: 800, color: TEXT, fontFamily: "Barlow, sans-serif" }}>{fmtFCFA(d.amount)}</p>
            </div>
          ))}

          {/* Top drivers */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 16, marginBottom: 10 }}>
            <p style={{ fontSize: 14, fontWeight: 700, color: TEXT }}>Top Livreurs</p>
            <span style={{ fontSize: 12, color: G_LIGHT, fontWeight: 600 }}>Ce mois</span>
          </div>
          {TOP_DRIVERS.map((d, i) => (
            <div key={i} style={{ background: WHITE, borderRadius: 14, padding: "12px 16px", marginBottom: 8, border: `1px solid ${BORDER}`, display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 32, height: 32, borderRadius: "50%", background: i === 0 ? "#FFD54F" : i === 1 ? "#E0E0E0" : i === 2 ? "#FFCC80" : G_PALE, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: i < 3 ? "#555" : G_CTA }}>{i + 1}</div>
              <div style={{ width: 36, height: 36, borderRadius: "50%", background: G_CTA, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 800, color: WHITE, fontFamily: "Barlow, sans-serif" }}>{d.initials}</div>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 13, fontWeight: 700, color: TEXT }}>{d.name}</p>
                <p style={{ fontSize: 11, color: TEXT_M }}>{d.trips} livraisons</p>
              </div>
              <p style={{ fontSize: 13, fontWeight: 800, color: G_CTA, fontFamily: "Barlow, sans-serif" }}>{d.amount}</p>
            </div>
          ))}
        </div>
      </div>
    );

    /* ─── ROLE SWITCHER ──────────────────────────────────────────────── */
    const RoleSwitcher = ({ role, setRole }) => (
      <div style={{ display: "flex", background: "rgba(0,0,0,0.3)", borderRadius: 14, padding: 4, marginBottom: 16, backdropFilter: "blur(10px)", border: "1px solid rgba(255,255,255,0.1)" }}>
        {[{ id: "user", label: "👤 Client" }, { id: "driver", label: "🛵 Livreur" }, { id: "admin", label: "📊 Admin" }].map(r => (
          <button key={r.id} onClick={() => setRole(r.id)} style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "none", background: role === r.id ? "rgba(52,168,83,0.9)" : "transparent", color: role === r.id ? "white" : "rgba(255,255,255,0.5)", fontSize: 12, fontWeight: 700, transition: "all 0.2s" }}>
            {r.label}
          </button>
        ))}
      </div>
    );

    /* ─── ROOT APP ───────────────────────────────────────────────────── */
    const App = () => {
      const [screen, setScreen] = useState("splash");
      const [role, setRole] = useState("user");

      const nav = (s) => {
        if (s === "driver") { setRole("driver"); setScreen("driver"); return; }
        if (s === "admin") { setRole("admin"); setScreen("admin"); return; }
        setRole("user");
        setScreen(s);
      };

      const handleRoleChange = (r) => {
        setRole(r);
        if (r === "driver") setScreen("driver");
        else if (r === "admin") setScreen("admin");
        else setScreen("home");
      };

      const screenMap = {
        splash:      <SplashScreen nav={nav}/>,
        inscription: <InscriptionScreen nav={nav}/>,
        otp:         <OTPScreen nav={nav}/>,
        home:        <HomeScreen nav={nav}/>,
        commande:    <CommandeScreen nav={nav}/>,
        tracking:    <TrackingScreen nav={nav}/>,
        validation:  <ValidationScreen nav={nav}/>,
        profil:      <ProfilScreen nav={nav}/>,
        historique:  <HistoriqueScreen nav={nav}/>,
        driver:      <DriverScreen nav={nav}/>,
        admin:       <AdminScreen nav={nav}/>,
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: 16 }}>
          {/* Role switcher (only for demo) */}
          {screen !== "splash" && (
            <div style={{ width: 375, marginBottom: 8 }}>
              <RoleSwitcher role={role} setRole={handleRoleChange}/>
            </div>
          )}

          {/* Phone Frame */}
          <div style={{
            width: 375, height: screen === "splash" ? 700 : 700,
            borderRadius: 44,
            background: "#0A0A0A",
            padding: "10px",
            boxShadow: "0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(34,119,63,0.15)",
            position: "relative",
            flexShrink: 0,
          }}>
            {/* Notch */}
            <div style={{ position: "absolute", top: 10, left: "50%", transform: "translateX(-50%)", width: 120, height: 30, background: "#0A0A0A", borderRadius: "0 0 20px 20px", zIndex: 10 }}/>
            {/* Screen */}
            <div style={{ width: "100%", height: "100%", borderRadius: 36, overflow: "hidden", background: WHITE, display: "flex", flexDirection: "column", position: "relative" }}>
              {screenMap[screen] || screenMap.home}
            </div>
            {/* Home indicator */}
            <div style={{ position: "absolute", bottom: 22, left: "50%", transform: "translateX(-50%)", width: 120, height: 4, background: "rgba(255,255,255,0.4)", borderRadius: 2 }}/>
          </div>

          {/* Screen labels */}
          <div style={{ marginTop: 16, display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center", maxWidth: 375 }}>
            {[
              { id: "splash", label: "Splash" },
              { id: "inscription", label: "Inscription" },
              { id: "otp", label: "OTP" },
              { id: "home", label: "Accueil" },
              { id: "commande", label: "Commande" },
              { id: "tracking", label: "Suivi" },
              { id: "validation", label: "Validation" },
              { id: "profil", label: "Profil" },
              { id: "historique", label: "Historique" },
            ].map(s => (
              <button key={s.id} onClick={() => { setRole("user"); setScreen(s.id); }}
                style={{ padding: "5px 12px", borderRadius: 20, border: `1px solid ${screen === s.id ? "rgba(52,168,83,0.8)" : "rgba(255,255,255,0.15)"}`, background: screen === s.id ? "rgba(52,168,83,0.15)" : "rgba(255,255,255,0.04)", color: screen === s.id ? "#52B788" : "rgba(255,255,255,0.4)", fontSize: 11, fontWeight: 600, cursor: "pointer", transition: "all 0.15s" }}>
                {s.label}
              </button>
            ))}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
